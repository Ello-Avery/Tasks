<div class="wrapper">
  <div class="details">
    <div (click)="editTask(task()?.id)" class="card-heading">
      <h3>{{ task()?.title }}</h3>
      <button class="editBtn"><i class="bi bi-arrow-right-circle-fill"></i></button>
    </div>
    <p class="status">{{ truncatedDescription() }}</p>
    @if (task()?.dueDate) {
      <p class="status">
        Due: <span [class.overdue]="isOverdue()">{{ formattedDueDate() }}</span>
      </p>
    }
  </div>
</div>
